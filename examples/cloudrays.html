<!DOCTYPE html>
<html>
<head>
	<title>Cloud God Rays (雲の薄明光線) - Yotei3D Examples</title>
	<meta charset="utf-8" />
	<link href="css/examples.css" rel="stylesheet" type="text/css" />
	<script type="module">

    import { Renderer, Shapes, Clouds, HDRSkyBox, TouchController,
             LensFlare, CloudVolumetricLight } from "@";

    window.addEventListener("load", function() {

      const renderer = new Renderer({
        backColor: [0.36, 0.52, 0.74, 1.0],
        enablePostprocess: true,
        enableAntialias: true,
        enableEnvmap: true,        // IBL from the HDRI lights the cloud puffs
        enableShadow: false,
        perspective: { method: "persp", angle: 66, near: 0.5, far: 4000 },
        bloomEffect: { enabled: true, threshold: 0.8, gamma: 1.2, intensity: 0.5 },
        renderingImage: { gamma: 1.12, resolutionRatio: 1 },
      });

      const scene = renderer.createScene();
      window._scene = scene;

      // --- sky -----------------------------------------------------------------
      // A clear-sky HDRI for believable cloud lighting + reflections, with a warm
      // haze bled into the lower sky so the horizon behind the rays reads warm.
      scene.skybox = new HDRSkyBox(renderer, "/textures/hdr/kloofendal_48d_partly_cloudy_puresky_4k.hdr", {
        faceSize: 1024,
        rotation: 130,
      });
      scene.iblIntensity = 1.5;
      scene.exposure = 1.05;

      scene.fog = { near: 10, far: 1200, color: [0.38, 0.34, 0.20] };
      scene.skyFog = {
        color: [0.98, 0.74, 0.46],
        lower: 0.0,
        upper: 0.10,
        density: 0.5,
      };

      // --- the sun -------------------------------------------------------------
      // Up in the sky and slightly ahead, so the camera looks up *into* it with
      // the cloud layer drifting across — the shafts then rain down through the
      // gaps. Both the flare and the volumetric rays follow this one direction.
      scene.sun.direction = [0.0, 1, -0.85];
      scene.sun.mat.color = [1.4, 1.18, 0.92];

      // a faint ground far below, just to anchor the horizon
      const ground = new Shapes.Plane(8000, 8000);
      ground.location.set(0, -40, 0);
      ground.mat.color = [0.88, 0.74, 0.46];
      ground.mat.roughness = 0.95;
      ground.mat.metallic = 0.05;
      scene.add(ground);

      // --- the clouds ----------------------------------------------------------
      // A broken cloud layer straddling the sun. Denser (higher opacity) than the
      // drifting-cumulus demo so it actually shadows the rays; the gaps between
      // clusters are where the light breaks through.
      const clouds = new Clouds({
        clusters: 250,
        puffsPerCluster: 14,
        width: 1700, depth: 1700,
        height: 300,
        heightVariance: 30,
        clusterRadius: 40,
        clusterThickness: 9,
        puffSizeMin: 110, puffSizeMax: 320,
        wind: [0.4, 7.5],
        opacity: 0.34,
        topColor: [1.0, 0.98, 0.94],
        bottomColor: [0.62, 0.66, 0.74],
        selfShadow: 0.05,
        fadeIn: 2.5,
        fadeMargin: 0.1,
      });
      scene.add(clouds);
      scene.on("frame", () => clouds.update());

      // --- sun / lens flare ----------------------------------------------------
      const lensFlare = new LensFlare(scene, {
        follow: scene.sun,
        color: [1.0, 0.93, 0.82],
        occluders: [clouds],   // the cloud layer softens the flare's ghosts
        ghosts: true,         // no chromatic discs — keep the sky clean
        intensity: 1,
        coreIntensity: 0.2,    // sun point + starburst + streak only
        scale: 2.5,
      });
      window._lensFlare = lensFlare;

      // --- volumetric light (薄明光線) -----------------------------------------
      // The headline effect: true volumetric god rays driven by a sun's-eye-view
      // cloud shadow map. Each frame the cloud puffs are rendered from the sun's
      // orthographic viewpoint into a transmittance map; that map both (a) dapples
      // the ground with cloud-shaped light/shadow and (b) is ray-marched per pixel
      // to scatter shafts through the gaps. World-space — not a screen smear — so
      // the shafts have real depth and the shadows track the drifting clouds.
      const godRays = new CloudVolumetricLight(scene, {
        clouds,                    // the cloud field that occludes the sun
        follow: scene.sun,
        // cloud shadow map
        resolution: 1024,
        density: 0.5,              // optical density: shadow / shaft contrast
        groundIntensity: 0.7,      // strength of the dappling on the ground
        // volumetric shafts
        color: [1.0, 0.92, 0.80],
        intensity: 2.4,
        steps: 100,
        maxDist: 1400,
        phaseG: 0.7,               // forward-scatter glow toward the sun
        scatter: 1.0,
      });
      window._godRays = godRays;

      // --- camera: look up into the sun through the clouds --------------------
      scene.mainCamera.fieldOfView = 66;
      scene.mainCamera.location.set(0, 1.5, 200);
      scene.mainCamera.angle.set(22, 0, 0);   // tilt up toward the sun

      const controller = new TouchController(scene, { speed: 0.12 });

      scene.animation = true;   // continuous redraw for the drifting clouds
      scene.show();
    });
  </script>
</head>
<body>
	<div class="fixed t-0 z-10 w-full px-4 py-2 flex justify-between items-center bg-gray-800/40 text-white">
		<div class="menu hover:text-sky-600">
			&lt; <a href="index.html">Back</a>
		</div>
    <div>Volumetric light through a drifting cloud layer — the sun's shafts break through the gaps. Drag to orbit; the clouds carve the rays live.</div>
		<div class="logo">
      <img src="/img/logo.svg">
		</div>
	</div>

	<div id="canvas-container">
	</div>
</body>
</html>
