<!DOCTYPE html>
<html>
<head>
	<title>Dynamic Sky - Yotei3D Examples</title>
	<meta charset="utf-8" />
	<link href="css/examples.css" rel="stylesheet" type="text/css" />
	<script type="module">

    import { Renderer, Shapes, SceneObject, DynamicSky, TouchController } from "@";

    window.addEventListener("load", function() {

      const renderer = new Renderer({
        enablePostprocess: true,
        enableEnvmap: true,    // drives runtime IBL baking from the (procedural) skybox
        enableShadow: true,
        renderingImage: {
          gamma: 1.2,
          resolutionRatio: 1,
        },
      });

      const scene = renderer.createScene();
      window._scene = scene;

      // Procedural single-scattering atmosphere baked into an HDR cubemap. As the
      // sun moves the sky is re-baked and the renderer re-bakes IBL from it, so
      // reflections and ambient light track the time of day automatically.
      // Passing `light: scene.sun` also keeps the directional light aligned with
      // the sky's sun and tints it (white at noon → warm at the horizon).
      const sky = new DynamicSky(renderer, {
        faceSize: 256,
        light: scene.sun,
      });
      scene.skybox = sky;

      scene.iblIntensity = 1.0;
      scene.mainCamera.exposure = 2.4;

      // ---- ground ----
      const ground = new Shapes.Cube();
      ground.scale.set(60, 0.2, 60);
      ground.location.set(0, -1.1, 0);
      ground.mat.color = [0.62, 0.62, 0.62];
      ground.mat.roughness = 0.95;
      ground.mat.metallic = 0.0;
      scene.add(ground);

      // ---- a polished metal sphere (mirrors the sky) flanked by matte spheres ----
      const hero = new Shapes.Sphere(32, 64);
      hero.mat.color = [0.95, 0.95, 0.97];
      hero.mat.metallic = 1.0;
      hero.mat.roughness = 0.08;
      hero.location.set(0, 0, 0);
      scene.add(hero);

      const palette = [
        [0.85, 0.25, 0.22], [0.90, 0.62, 0.18], [0.30, 0.55, 0.85], [0.35, 0.70, 0.40],
      ];
      for (let i = 0; i < palette.length; i++) {
        const s = new Shapes.Sphere(24, 48);
        const a = (i / palette.length) * Math.PI * 2;
        s.location.set(Math.cos(a) * 3.2, -0.45, Math.sin(a) * 3.2);
        s.scale.set(0.55, 0.55, 0.55);
        s.mat.color = palette[i];
        s.mat.metallic = 0.1;
        s.mat.roughness = 0.4;
        scene.add(s);
      }

      scene.mainCamera.fieldOfView = 50;
      scene.mainCamera.location.set(0, 2.5, 11);
      scene.mainCamera.angle.set(-8, 0, 0);

      const controller = new TouchController(scene, {
        enableVerticalRotation: true,
      });
      controller.targetObject = hero;

      // ---- animate the time of day ----
      // The sun arcs between golden-hour (~3°) and high sun (~71°) while its
      // azimuth sweeps, so the sky colour, the metal sphere's reflection and the
      // ambient light continuously shift. (The sun is kept above the horizon so
      // the showcase stays lit; drop the floor to let it set into night.)
      let t = 0.0;
      scene.on("frame", () => {
        t += 0.0009;
        const elevation = 37 + 34 * Math.sin(t * Math.PI * 2); // ~3°..71°
        const azimuth = 90 + t * 220;
        sky.setSunElevationAzimuth(elevation, azimuth);
        scene.requireUpdateFrame(); // keep the day cycle running
      });

      scene.requireUpdateFrame();
      scene.show();
    });
  </script>
</head>
<body>
	<div class="fixed t-0 z-10 w-full px-4 py-2 flex justify-between items-center">
		<div class="menu hover:text-sky-600">
			&lt; <a href="index.html">Back</a>
		</div>
    <div>Dynamic Sky: a procedural single-scattering atmosphere baked to an HDR cubemap. The sun cycles through the day and the sky, reflections and ambient light all follow. Drag to orbit, scroll to zoom.</div>
		<div class="logo">
      <img src="/img/logo.svg">
		</div>
	</div>

	<div id="canvas-container">
	</div>
</body>
</html>
