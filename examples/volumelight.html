<!DOCTYPE html>
<html>
<head>
	<title>Volumetric Light (都市の光芒) - Yotei3D Examples</title>
	<meta charset="utf-8" />
	<link href="css/examples.css" rel="stylesheet" type="text/css" />
	<script type="module">

    import { Renderer, Shapes, SceneObject, HDRSkyBox, TouchController,
             LensFlare, VolumetricLight } from "@";

    window.addEventListener("load", function() {

      const renderer = new Renderer({
        backColor: [0.06, 0.07, 0.10, 1],
        enablePostprocess: true,
        enableAntialias: true,
        enableShadow: true,        // low sun → long shadows raking toward the camera
        perspective: { method: "persp", angle: 55, near: 0.5, far: 4000 },
        shadowQuality: { scale: 12, viewDepth: 2, resolution: 2048, intensity: 0.5 },
        bloomEffect: { enabled: true, threshold: 0.8, gamma: 1.2, intensity: 0.5 },
        renderingImage: { gamma: 1.22, resolutionRatio: 1 },
      });

      const scene = renderer.createScene();
      window._scene = scene;

      // --- sky -----------------------------------------------------------------
      // A clear-sky HDRI lights the towers and gives them crisp window-glass
      // reflections. We spin it so its bright quarter sits ahead of the camera,
      // then bleed a warm haze into the lower sky (skyFog) so the horizon the
      // shafts emerge from reads as a sunset rather than flat blue.
      scene.skybox = new HDRSkyBox(renderer, "/textures/hdr/kloppenheim_06_puresky_4k.hdr", {
        faceSize: 1024,
        rotation: 132,
      });
      scene.iblIntensity = 1.6;
      scene.mainCamera.exposure = 1.05;

      // distance haze so the far towers melt into the glow instead of ending hard
      scene.fog = { near: 10, far: 200, color: [0.62, 0.52, 0.42] };

      // warm sunset band along the bottom of the sky (where the sun sits)
      scene.skyFog = {
        color: [0.95, 0.62, 0.34],
        lower: 0.0,    // dir.y at/below which the sky is fully warmed
        upper: 0.34,   // dir.y where it fades back to the HDRI's own blue
        density: 0.85,
      };

      // --- the sun -------------------------------------------------------------
      // The single source of truth for the sun direction: it aims the directional
      // light (so shadows rake toward us), and both the lens flare and the
      // volumetric shafts follow it. A low sun nearly dead ahead (small +y, -z)
      // drops a sunset straight down the avenue.
      scene.sun.direction = [0.04, 0.09, -1];
      scene.sun.mat.color = [1.4, 1.12, 0.82];

      // --- ground --------------------------------------------------------------
      const ground = new Shapes.Plane(4000, 4000);
      ground.location.set(0, 0, 0);
      ground.mat.color = [0.10, 0.10, 0.13];
      ground.mat.roughness = 0.85;
      ground.mat.metallic = 0.0;
      scene.add(ground);

      // --- the city ------------------------------------------------------------
      // A grid of cubes flanking a central avenue that points straight at the
      // sun. The avenue and the gaps between towers are what the light streams
      // through; the towers themselves are the occluders that carve the shafts.
      // Deterministic RNG so the skyline (and the thumbnail) is reproducible.
      const rng = mulberry32(0x5eed1234);

      const city = new SceneObject();
      scene.add(city);

      const buildings = [];

      const perSide = 4;      // tower columns on each side of the avenue
      const rows = 4;         // depth, marching away toward the sun
      const spacingX = 22;    // gap between columns
      const spacingZ = 27;    // gap between rows
      const avenue = 14;      // half-width of the clear central avenue

      for (const side of [-1, 1]) {
        for (let c = 0; c < perSide; c++) {
          for (let r = 0; r < rows; r++) {
            const w = 5.5 + rng() * 4.5;
            const d = 5.5 + rng() * 4.5;
            // a varied skyline that rises toward the back, but keep the
            // avenue-facing column a touch lower so the sun shows as a disc
            // between the towers rather than a sliver
            const h = 9 + rng() * 28 + c * 3 + r * 1.5;

            const b = new Shapes.Cube();
            b.scale.set(w, h, d);

            const x = side * (avenue + c * spacingX) + (rng() - 0.5) * 3;
            const z = 14 - r * spacingZ + (rng() - 0.5) * 4;
            b.location.set(x, h / 2, z);

            // dark, lightly bluish concrete: near-silhouette against the bright
            // sky, which is exactly what makes the shafts read. A touch of
            // metallic + low roughness picks up a sliver of warm sky on the
            // sunward faces.
            const tone = 0.16 + rng() * 0.10;
            b.mat.color = [tone, tone * 1.03, tone * 1.12];
            b.mat.roughness = 0.75 + rng() * 0.25;
            b.mat.metallic = 0.15;

            city.add(b);
            buildings.push(b);
          }
        }
      }

      // --- sun / lens flare (太陽フレア) ---------------------------------------
      // The bright sun point + corona + starburst, bound to scene.sun. The towers
      // occlude it, so the disc winks out when one rotates in front of the sun.
      const lensFlare = new LensFlare(scene, {
        follow: scene.sun,
        occluders: buildings,
        color: [1.0, 0.86, 0.62],
        intensity: 0.22,       // ghost chain — kept subtle so the shafts lead
        coreIntensity: 0.7,    // sun point + starburst + streak (a tasteful accent)
        scale: 1,
      });
      window._lensFlare = lensFlare;

      // --- volumetric light (ボリュームライト / 薄明光線) ----------------------
      // The headline effect: god rays cast by the towers. It projects each
      // tower's silhouette, punches it out of a warm sun disc, and radially
      // smears the result outward from the sun — so the light streams through the
      // avenue and the gaps between the buildings, shadowed by the skyline.
      const godRays = new VolumetricLight(scene, {
        follow: scene.sun,
        occluders: buildings,
        color: [1.0, 0.80, 0.52],
        intensity: 0.1,
        density: 1,   // ray reach (k up to ~2× → long shafts)
        decay: 0.965,    // tail falloff
        weight: 0.1,
        samples: 64,
        sunSize: 1,
      });
      window._godRays = godRays;

      // --- camera: a hero shot looking down the avenue into the sun -----------
      scene.mainCamera.fieldOfView = 55;
      scene.mainCamera.location.set(0, 15, 120);
      scene.mainCamera.angle.set(-2.5, 0, 0);

      // Orbit the city (the controller spins the holder, the sun stays put), so
      // dragging sweeps the skyline across the sun and the shafts re-carve live.
      const controller = new TouchController(scene, {
        speed: 0.15,
      });
      controller.targetObject = city;

      // gentle idle auto-spin so the rays keep sweeping; stops on first drag
      let autoSpin = true;
      window.addEventListener("pointerdown", () => { autoSpin = false; });
      scene.on("frame", () => {
        if (autoSpin) city.angle.y += 0.02;
      });
      scene.animation = true;   // keep rendering so the effect stays live

      scene.show();
    });

    // small deterministic PRNG (mulberry32)
    function mulberry32(seed) {
      let a = seed >>> 0;
      return function () {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
  </script>
</head>
<body>
	<div class="fixed t-0 z-10 w-full px-4 py-2 flex justify-between items-center bg-gray-800/40 text-white">
		<div class="menu hover:text-sky-600">
			&lt; <a href="index.html">Back</a>
		</div>
    <div>Volumetric light — god rays cast by a city of cubes against a low sun. Drag to orbit; the shafts re-carve live.</div>
		<div class="logo">
      <img src="/img/logo.svg">
		</div>
	</div>

	<div id="canvas-container">
	</div>
</body>
</html>
