<!DOCTYPE html>
<html>
<head>
	<title>Carrier Landing — P1: Carrier — Yotei3D Examples</title>
	<meta charset="utf-8" />
	<link href="css/examples.css" rel="stylesheet" type="text/css" />
	<style>
		#land-hud{position:fixed;left:12px;bottom:12px;z-index:20;
			background:rgba(18,26,38,.62);color:#eaf2ff;
			font:12px/1.5 system-ui,-apple-system,sans-serif;
			border-radius:8px;padding:8px 12px;backdrop-filter:blur(4px);user-select:none}
		#land-hud .lh-title{font-weight:600;margin-bottom:4px;opacity:.85}
		#land-hud b{display:inline-block;min-width:30px;text-align:center;
			padding:0 4px;border-radius:4px;background:rgba(127,179,255,.22);
			font-weight:600;font-variant-numeric:tabular-nums}
		#land-hud .lh-dim{margin-top:6px;opacity:.7;font-variant-numeric:tabular-nums}
	</style>
	<script type="module">

    import { Renderer, Scene, SceneObject, Ocean, HDRSkyBox, OrbitController, LensFlare } from "@";
    import { Vec3 } from "@/math";

    window.addEventListener("load", function() {

      // ----------------------------------------------------------------------
      // Carrier Landing simulation — Phase 1 (P1)
      // Goal of this phase: get the USS Eisenhower (CVN-69) glTF rendering on an
      // open ocean under a clear-sky HDRI, kept fixed at the centre and inspected
      // with an orbit camera. No flight model yet — that arrives in later phases.
      // See LANDING-SPECS.md for the full roadmap.
      // ----------------------------------------------------------------------

      const renderer = new Renderer({
        backColor: [0.70, 0.82, 0.92, 1],
        enablePostprocess: true,
        enableAntialias: true,
        enableShadow: false,        // open seascape: nothing else to cast onto
        // Wide-open seascape + a 230-unit-long ship: push the far plane well out
        // so the ocean reaches the horizon and the whole hull stays unclipped.
        perspective: { method: "persp", angle: 55, near: 0.5, far: 6000 },
        bloomEffect: { enabled: true, threshold: 0.6, gamma: 1.4, intensity: 0.8 },
        renderingImage: { gamma: 1.1, resolutionRatio: 1 },
      });

      const scene = renderer.createScene();
      window._scene = scene;

      // --- sky: clear-blue HDRI. Lights the ship (IBL) and is the backdrop the
      //     ocean reflects. -----------------------------------------------------
      scene.environment = new HDRSkyBox(renderer, "/textures/hdr/kloppenheim_06_puresky_4k.hdr", {
        faceSize: 1024,
        rotation: 180,
      });
      scene.environment.mat = { color: [0.4, 0.4, 0.4] };
      scene.environment.intensity = 1.0;
      scene.mainCamera.exposure = 0.4;

      // haze the sea into the horizon and bleed the same haze into the bottom of
      // the sky so they meet at one colour instead of a hard line.
      scene.fog = { near: 400, far: 4500, color: [0.16, 0.26, 0.36] };
      scene.skyFog = {
        color: [0.30, 0.40, 0.48],
        lower: 0.0,
        upper: 0.02,
        density: 0.5,
      };

      // --- sun: warm daylight key, low-ish so the deck and island catch a clear
      //     directional highlight on top of the sky's ambient. ------------------
      scene.sun.direction = [1.7, 0.2, -1.4];
      scene.sun.mat.color = [1.3, 1.18, 0.95];

      // --- the ocean ---------------------------------------------------------
      const ocean = new Ocean({
        "size": 100000,
        "segments": 10,
        "level": 0,
        "wind": [ 1, 0.4 ],
        "waveAmp": 0.01,
        "waveLen": 100,
        "waveSpeed": 0.0,
        "steepness": 0.01,
        "timeScale": 1,
        
        "sunGlitter": 0.2,
        "specStrength": 0.05,

        "fresnelPower": 5,
        "fresnelBias": 0.01,
        "reflectivity": 0.2,
        "reflectionBlur": 1.50,

        "rippleScale": 0.5,
        "rippleStrength": 0.15,
        "rippleDetail": 3,
        "deepColor": [ 0.016, 0.067, 0.125 ],
        "shallowColor": [ 0.078, 0.157, 0.243 ],
      })
      ocean.location.set(0, 0, 0);
      scene.add(ocean);
      window._ocean = ocean;

      // --- the aircraft carrier (USS Dwight D. Eisenhower CVN-69, glTF) -------
      // The model arrives standing on its stern (its long axis is the glTF +Y),
      // so we hand ORIENT to createObjectFromURL as a load-time `baseTransform`:
      // the loader bakes that -90° into an internal, invisible node, so the
      // object comes back already laid flat (deck up) AND with a clean
      // root.angle = [0,0,0] — later phases steer heading via root.angle without
      // the correction occupying it. We then measure its (already-oriented)
      // bounding box and auto-fit: scale the longest horizontal axis to
      // DECK_LENGTH engine units, centre it on the origin in X/Z, and drop the
      // keel below y=0 so the waterline cuts the hull.
      //
      // ORIENT (-90° about X) brings the deck face-up and the hull fore/aft onto
      // the Z axis — verified against the model; the auto-fit numbers below
      // (raw 293.9×241.8×1061.8 → deck ~230×64 u, height ~52 u) confirm it.
      //
      // DECK_LENGTH is chosen to match the F-2's scale for later phases: the F-2
      // model is ~10 units long; a real Eisenhower deck (~333 m) is ~21× a real
      // F-2 (~15.5 m), so ~230 units keeps the jet-to-ship ratio realistic when
      // we drop the aircraft in.
      const ORIENT = [-90, 0, 0];   // lay the ship flat, deck up, hull along Z
      const DECK_LENGTH = 230;
      const DRAFT = 8;   // how far the keel sits below the waterline (y=0)

      const holder = new SceneObject();   // the carrier rides this; we drive it forward
      scene.add(holder);
      window._carrierHolder = holder;

      // The carrier is now under way, so the sea must travel with it (otherwise
      // the ship sails off the 12000u grid). Follow the *holder* — the moving
      // subject — not the camera eye; Ocean snaps the follow to a grid cell so
      // the waves stay world-locked and never swim. The wake source is also the
      // holder: the water shader lays a foam trail along the path it carves.
      ocean.options.followTarget = holder;
      ocean.options.wake = {
        source: holder,
        dropDistance: 20,     // sample the path every 5u (smooth trail)
        life: 50,            // foam lingers 16s ≈ a long trail at this speed
        maxPoints: 48,       // == shader WAKE_MAX
        width: 22,           // half-width at the stern (ship beam ≈ 64u)
        widthGrowth: 2,      // tail fans out to ~5× that
        foamColor: [1.0, 1.05, 1.12],
        foamIntensity: 0.5,
        sparkle: 6,          // sun glints twinkling on the flying spray (HDR)
      };
      // Depth-based contact foam: white water where the hull breaks the surface
      // (and any future shoreline/rocks). A scene depth pre-pass detects solids
      // sitting just under the water; this needs no per-object setup.
      ocean.options.contactFoam = {
        enabled: true,
        distance: 2,         // foam fades out this far *below* the waterline (world Y)
        color: [1.0, 1.05, 1.12],
        intensity: 0.3,
      };

      const dimEl = () => document.getElementById("lh-dim");

      scene.createObjectFromURL("/models/carrier/scene.gltf", root => {
        if (!root) { console.error("failed to load carrier scene.gltf"); return; }
        window.carrier = root;
        holder.add(root);

        console.log(root);

        // ORIENT is baked in at load (baseTransform below), so root is already
        // lying flat and root.angle is a clean [0,0,0]. The bounds come back
        // oriented; scale/translate below are applied analytically — world =
        // T + scale * boundsPoint — so we never re-measure.
        const bb = root.getBounds();
        const sz = bb.size, mn = bb.min, mx = bb.max;
        const cx = (mn.x + mx.x) / 2, cz = (mn.z + mx.z) / 2;

        // after ORIENT the hull length lies along Z; take the longest horizontal
        // axis as the deck length and scale to DECK_LENGTH.
        const longest = Math.max(sz.x, sz.z);
        const s = DECK_LENGTH / longest;

        root.scale.set(s, s, s);
        // centre on origin in X/Z; lift so the scaled keel sits DRAFT below y=0.
        root.location.set(-s * cx, -s * mn.y - DRAFT, -s * cz);

        // report the fit so later phases can reuse the numbers
        const fit = {
          rawSize: { x: +sz.x.toFixed(2), y: +sz.y.toFixed(2), z: +sz.z.toFixed(2) },
          scale: +s.toFixed(4),
          deckLength: DECK_LENGTH,
          worldSize: { x: +(sz.x * s).toFixed(1), y: +(sz.y * s).toFixed(1), z: +(sz.z * s).toFixed(1) },
        };
        window.carrierFit = fit;
        console.log("[carrier] auto-fit", fit);

        _carrierHolder.eachChild(c=>{
          if(c.name=="Object_3") {
            // change deck material
            c.mat.roughness = 0.7;
            c.mat.metallic = 0.5;
          }
        });

        const el = dimEl();
        if (el) {
          el.textContent = `deck ≈ ${fit.worldSize.x}×${fit.worldSize.z} u · h ${fit.worldSize.y} u · scale ${fit.scale}`;
        }

        scene.requireUpdateFrame();
      }, { baseTransform: { angle: ORIENT } });

      // --- sun / lens flare --------------------------------------------------
      const lensFlare = new LensFlare(scene, {
        follow: scene.sun,
        occluders: [holder],
        color: [1, 1, 0.95],
        intensity: 1,
        coreIntensity: 0.1,
        scale: 2.0,
      });
      window._lensFlare = lensFlare;

      // --- camera + orbit controller -----------------------------------------
      // Orbit the camera around the carrier (docs/camera.md → OrbitController).
      // The pivot sits at mid-ship height so the whole hull + island frame up.
      // The carrier is under way, so each frame we shift the orbit pivot by the
      // ship's travel (see the frame loop): the camera rides along keeping the
      // ship centred while the user's own orbit / zoom / pan are preserved.
      // We place the camera first — a 3/4 view off the port bow — and let
      // OrbitController derive its yaw / pitch / distance from that pose.
      scene.mainCamera.fieldOfView = 55;
      scene.mainCamera.location.set(-200, 30, 120);

      const controller = new OrbitController({
        target: new Vec3(0, 18, 0),   // mid-ship pivot (carrier is centred on X/Z)
        minPitch: -2,                 // stay above the waterline
        maxPitch: 82,
        minDistance: 120,             // don't push the eye inside the hull
        maxDistance: 1400,
        // This scene is ~200u+ in scale, so the default sensitivities (tuned for
        // ~5u scenes) feel wrong: drag spins too fast and the wheel barely zooms.
        // zoomSpeed is in *world units* and isn't distance-scaled, so it must be
        // bumped to match the 120..1400 distance range (~`zoomSpeed/6` u/notch).
        rotateSpeed: 3,               // calmer orbit (default 15)
        zoomSpeed: 100,               // ~40 u/notch instead of ~1 (default 6)
      });
      scene.mainCamera.controller = controller;
      window._controller = controller;

      // --- sail the carrier + drive the sea ----------------------------------
      // Move the holder forward along its heading each frame, slide the orbit
      // pivot by the same delta so the camera tracks the ship, then advance the
      // ocean (which follows the holder and trails its wake). All motion is
      // real-time delta-based so it runs at a fixed speed regardless of FPS.
      //
      // This glTF's bow is its local -Z (verified: the "69" bow number sits on
      // that end), so "forward" is local -Z rotated into the world by HEADING.
      // At HEADING 0 the carrier therefore steams bow-first toward world -Z.
      const HEADING = 0;            // ship yaw in degrees (0 = sail toward -Z)
      const SHIP_SPEED = 5;        // world units / second
      const hdg = HEADING * Math.PI / 180;
      const fwd = { x: -Math.sin(hdg), z: -Math.cos(hdg) };
      holder.angle.y = HEADING;     // point the hull along the heading

      let _lastT = 0;
      scene.on("frame", () => {
        const now = performance.now();
        const dt = _lastT ? Math.min((now - _lastT) / 1000, 0.05) : 0.016;
        _lastT = now;

        const step = SHIP_SPEED * dt;
        const dx = fwd.x * step, dz = fwd.z * step;

        holder.location.x += dx;
        holder.location.z += dz;

        // shift the orbit pivot by the ship's travel → camera follows, while
        // the user's orbit/zoom/pan offsets are kept intact.
        controller.target.x += dx;
        controller.target.z += dz;
        controller.setTarget(controller.target);

        ocean.update();             // follow (grid-snapped) + advance wake/waves
      });
      scene.animation = true;

      scene.show();
    });

  </script>
</head>
<body>
	<div class="fixed t-0 z-10 w-full px-4 py-2 flex justify-between items-center bg-gray-800/40 text-white">
		<div class="menu hover:text-sky-600">
			&lt; <a href="index.html">Back</a>
		</div>
    <div>Carrier Landing — P1: USS Eisenhower (CVN-69) on the open sea. Drag to orbit, scroll to zoom, shift+drag to pan.</div>
		<div class="logo">
      <img src="/img/logo.svg">
		</div>
	</div>

	<div id="land-hud">
		<div class="lh-title">Orbit camera</div>
		<div><b>drag</b> &nbsp;orbit &nbsp; <b>scroll</b> &nbsp;zoom</div>
		<div><b>shift</b>+drag &nbsp;pan</div>
		<div class="lh-dim" id="lh-dim">loading carrier…</div>
	</div>

	<div id="canvas-container">
	</div>

	<div class="fixed bottom-0 right-0 z-10 px-4 py-2" style="font-size:11px; opacity:0.55;">
		Carrier: "USS Dwight D. Eisenhower CVN-69" by Muhamad Mirza Arrafi — CC-BY-4.0
	</div>
</body>
</html>
