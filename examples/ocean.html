<!DOCTYPE html>
<html>
<head>
	<title>Ocean - Yotei3D Examples</title>
	<meta charset="utf-8" />
	<link href="css/examples.css" rel="stylesheet" type="text/css" />
	<script type="module">

    import { Renderer, Ocean, Terrain, SkyBox, HDRSkyBox, TouchController, LensFlare, Dolphin, WaterSplash, Seabird, AudioMixer } from "@";
    import { Vec3 } from "@/math";

    window.addEventListener("load", function() {

      const renderer = new Renderer({
        backColor: [0.70, 0.82, 0.92, 1],
        // enableLighting: true,
        enablePostprocess: true,
        enableAntialias: true,
        enableShadow: false,        // shadows are expensive and not needed for this demo
        // Wide open seascape: push the far plane well out so the ocean reaches
        // the horizon instead of being clipped to sky.
        perspective: { method: "persp", angle: 60, near: 0.5, far: 3000 },
        // shadowQuality: { scale: 8, viewDepth: 2, resolution: 1024, intensity: 0.3 },
        bloomEffect: { enabled: true, threshold: 0.3, gamma: 1.5, intensity: 10.4 },
        renderingImage: { gamma: 1.1, resolutionRatio: 0.5 },
      });

      const scene = renderer.createScene();
      window._scene = scene;

      // --- sky: a cubemap skybox. The renderer bakes IBL from it, and the
      //     ocean reflects this same cubemap (no extra reflection pass). -------
      scene.skybox = new HDRSkyBox(renderer, "/textures/hdr/kloppenheim_06_puresky_4k.hdr", {
        faceSize: 1024,
        rotation: 130,
      });
      scene.iblIntensity = 2.5;
      scene.mainCamera.exposure = 1.1;

      // haze the sea into the horizon so the water plane's far edge is hidden
      scene.fog = { near: 100, far: 2000, color: [0.34, 0.43, 0.50] };

      // ...and bleed the same haze into the bottom of the skybox so the sky and
      // the fogged sea meet at one colour instead of a hard horizon line. The
      // ocean's far edge sits at view-ray y ≈ -0.06, so keep full haze to a
      // touch below that and let it fade out by ~y=0.2 (a few degrees up).
      scene.skyFog = {
        color: [0.34, 0.43, 0.50],  // defaults to scene.fog.color if omitted
        lower: 0.0,   // dir.y at/below which the sky is fully hazed
        upper: 0.02,    // dir.y where the haze has faded back to clear sky
        density: 0.7,   // <1 keeps a hint of the sky's own colour/glow
      };

      // --- the ocean ---------------------------------------------------------
      const ocean = new Ocean({
        size: 10000,
        segments: 100,  // grid resolution per axis (wave detail)
        level: 0,
        wind: [1.0, 0.4],
        waveAmp: 0.1,  // amplitude of the largest wave
        waveLen: 100,  // wavelength of the largest wave
        waveSpeed: 0.1,  // crest travel speed
        steepness: 0.75, // 0 rolling swell .. 1 sharp choppy crests

        sunGlitter: 0.2,  // 0 = no glitter, 1 = full glitter
        specStrength: 0.15,  // 0 = no specular, 1 = full specular

        fresnelPower: 5.0,
        fresnelBias: 0.2,
        reflectivity: 0.3,
        reflectionBlur: 1.5,  // distance/grazing reflection softening (0 = mirror-sharp)

   			rippleScale: 1.0,
  			rippleStrength: 0.5,
        // breaks up the "oily" near-water into fine choppy facets (0 = off, smooth/oily).
        rippleDetail: 3.0,

        deepColor: [0.012, 0.07, 0.10],
        shallowColor: [0.10, 0.36, 0.40],
        followTarget: scene.mainCamera,   // endless sea: recentres on the camera
      });
      ocean.location.set(0, 0, 0);
      scene.add(ocean);
      window._ocean = ocean;

      // --- a small rocky island poking out of the water ----------------------
      const island = new Terrain({
        width: 100, depth: 100, segments: 120,
        height: 100, noiseScale: 2.2, octaves: 5, seed: 21,
        heightFunction: (x, z, height) => {
          // a single hill that dips below sea level toward the edges. `height`
          // is the option above (passed in as the 3rd arg), so changing it now
          // scales the peak; -2.2 keeps the skirt below the waterline.
          const r = Math.sqrt(x * x + z * z);
          const falloff = Math.max(0, 1 - r / 34);
          const n = 0.6 + 0.4 * Math.sin(x * 0.18) * Math.cos(z * 0.21);
          return falloff * falloff * height * n - 2.2;
        },
        color: [0.42, 0.40, 0.34],
      });
      island.location.set(0, -10, -100);
      island.scale.set(1.5, 1, 1.5);
      // scene.add(island);

      // --- lighting: warm sun ------------------------------------------------
      // scene.sun is the single source of truth for the sun direction: the water
      // shader lays its glitter "sun road" along it and the lens flare follows
      // it. `direction` points toward the sun (its length doesn't matter); here
      // a low sun dead ahead (small +y, -z) puts a sunset straight in front of
      // the camera, just above the horizon.
      const sunDir = [0, 0.1, -1];
      scene.sun.direction = sunDir;
      scene.sun.mat.color = [1.3, 1.18, 0.95];

      // --- camera + orbit ----------------------------------------------------
      scene.mainCamera.fieldOfView = 60;
      scene.mainCamera.location.set(-100, 10, 60);
      scene.mainCamera.angle.set(0, -20, 0);

      const controller = new TouchController(scene);

      // --- a pod of leaping dolphins ----------------------------------------
      // Fully procedural (no model). Placed far out along the camera→sun line so
      // they surface as backlit silhouettes on the sun's glitter road, then arc
      // out of the water (pitching to follow the leap) and dive back under,
      // hidden by the opaque water until the next jump. Staggered size/timing.
      const cam = scene.mainCamera.location;   // live reference (camera drifts in x)
      const sl = Math.hypot(sunDir[0], sunDir[1], sunDir[2]) || 1;
      const far = 150;  // how far down the sun line the pod surfaces

      // A point on the camera→sun line: camera + sunDir * far, jittered ±20.
      // Read live so it tracks the drifting camera — used for the initial leap and
      // again from onLeapEnd (while the dolphin is submerged) so each surfacing
      // lands back on the sun road in front of the camera.
      const sunRoadXZ = () => ({
        x: cam.x + (sunDir[0] / sl) * far + (Math.random() * 2 - 1) * 50,
        z: cam.z + (sunDir[2] / sl) * far + (Math.random() * 2 - 1) * 50,
      });

      const mkLeap = (extra) => Object.assign({ level: 0, airTime: 0.7 }, sunRoadXZ(), extra);
      const pod = [
        new Dolphin({ length: 4.4, leap: mkLeap({ height: 0.6, span: 3, period: 7.5, phase: 0.0 }) }),
        new Dolphin({ length: 3.4, leap: mkLeap({ height: 1.0, span: 5, period: 6.5, phase: 5.2 }) }),
        new Dolphin({ length: 3.0, leap: mkLeap({ height: 0.4, span: 2, period: 5.6, phase: 2.6 }) }),
      ];
      pod.forEach(d => {
        // re-place onto the sun road each time it dives under (camera has moved)
        d.onLeapEnd = (dd) => { const p = sunRoadXZ(); dd.leap.x = p.x; dd.leap.z = p.z; };
        scene.add(d);
      });
      window._pod = pod;

      // --- water spray ------------------------------------------------------
      // One shared WaterSplash for the whole pod. Each dolphin fires its onSplash
      // hook as it crosses the surface — a big crown on entry, a smaller burst as
      // it launches out. `sizeScale` is pushed out so the distant droplets stay
      // visible. Added after the ocean so the spray blends over the water.
      const splash = new WaterSplash({ maxParticles: 1400, level: 0, sizeScale: 80, maxSize: 130 });
      scene.add(splash);
      window._splash = splash;

      pod.forEach(d => {
        d.onSplash = (pos, kind, dolphin) => {
          const s = dolphin.options.length / 4;   // scale the burst with the dolphin
          if (kind === "enter") {
            splash.burst(pos, { count: 130, speed: 13 * s, spread: 0.7, size: [5, 7], life: [0.7, 1.5] });
          } else {
            splash.burst(pos, { count: 110, speed: 10 * s, spread: 0.55, size: [5, 7], life: [0.5, 1.1] });
          }
        };
      });

      // --- seabirds ---------------------------------------------------------
      // A few procedural gulls wheeling over the sea, up against the sky. Each
      // circles a centre offset along the camera→sun line and follows the camera,
      // with staggered size / radius / speed / flap so the flock feels alive.
      const birdC = [
        (sunDir[0] / sl) * 90, 16, (sunDir[2] / sl) * 90,   // base offset toward the sun, low over the sea
      ];
      const bird = (extra, glide) => new Seabird(Object.assign({
        wingSpan: 5.0, bodyLen: 1.5, flapFreq: 2.4,
      }, extra, { glide: Object.assign({
        center: [birdC[0], birdC[1], birdC[2]], radius: 30, speed: 0.2,
        followTarget: scene.mainCamera,
      }, glide) }));
      const flock = [
        bird({ wingSpan: 2.0, flapPhase: 0.0 }, { center: [birdC[0] - 12, 20, birdC[2] + 8],  radius: 34, speed: 0.52, phase: 0.0 }),
        bird({ wingSpan: 2.0, flapPhase: 1.7 }, { center: [birdC[0] + 16, 33, birdC[2] - 10], radius: 26, speed: 0.62, phase: 2.1 }),
        bird({ wingSpan: 3.4, flapPhase: 3.0 }, { center: [birdC[0] + 4,  24, birdC[2] + 20], radius: 50, speed: 1.00, phase: 4.0, dir: -1 }),
        bird({ wingSpan: 4.0, flapPhase: 0.8 }, { center: [birdC[0] - 22, 31, birdC[2] - 4],  radius: 102, speed: 1.16, phase: 5.2 }),
      ];
      flock.forEach(b => scene.add(b));
      window._flock = flock;

      // --- sun / lens flare (太陽フレア) -------------------------------------
      // Bound to scene.sun, so the flare tracks the same direction that drives
      // the water glitter — move scene.sun and the flare follows live.
      // `occluders: [island]` hides the flare when the island grows tall enough
      // to block the line of sight to the sun.
      const lensFlare = new LensFlare(scene, {
        follow: scene.sun,
        occluders: [island],
        color: [1, 1, 0.95],
        intensity: 2,         // strength of the ghost chain (reflection discs)
        coreIntensity: 0.5,   // sun point + starburst + streak — tune separately
        scale: 2.0,
      });
      window._lensFlare = lensFlare;

      // --- drive the waves ---------------------------------------------------
      scene.on("frame", () => {
        ocean.update();
        pod.forEach(d => d.update());
        splash.update();
        flock.forEach(b => b.update());
        scene.mainCamera.location.x += 0.003;
      });
      scene.animation = true;

      // --- sound -------------------------------------------------------------
      // Ocean waves + distant gull calls, mixed through one AudioMixer (a single
      // Web Audio context — seamless loops, reliable simultaneous playback on
      // mobile, unlike multiple <audio> elements).
      //   Ocean waves: Sound Effect from Pixabay
      //   Gull calls: "flock of seagulls" by flutie8211 (Freesound)
      const mix = new AudioMixer();
      mix.loop("/audio/ocean-waves.mp3", { volume: 0.6 });
      mix.loop("/audio/seagulls.mp3", { volume: 0.35 });
      mix.unlockOnGesture();

      const soundBtn = document.getElementById("sound-toggle");
      function setSound(on) {
        mix.enabled = on;
        soundBtn.textContent = on ? "🔊 Sound: On" : "🔈 Sound: Off";
      }
      soundBtn.addEventListener("click", () => setSound(!mix.enabled));
      setSound(true);   // default On (unlocked on the first gesture)

      scene.show();
    });

  </script>
</head>
<body>
	<div class="fixed t-0 z-10 w-full px-4 py-2 flex justify-between items-center bg-gray-800/40 text-white">
		<div class="menu hover:text-sky-600">
			&lt; <a href="index.html">Back</a>
			&nbsp;&nbsp;
			<a id="sound-toggle" href="javascript:void(0)">🔊 Sound: On</a>
		</div>
    <div>GPU Gerstner-wave ocean reflecting the skybox, with a small island. Drag to orbit, scroll to zoom.</div>
		<div class="logo">
      <img src="/img/logo.svg">
		</div>
	</div>

	<div id="canvas-container">
	</div>

	<div class="fixed bottom-0 left-0 z-10 px-4 py-2" style="font-size:11px; opacity:0.55;">
		Wave sound from <a href="https://pixabay.com" target="_blank" rel="noopener">Pixabay</a>
		&middot; Gull calls by flutie8211 (<a href="https://freesound.org" target="_blank" rel="noopener">Freesound</a>)
	</div>
</body>
</html>
