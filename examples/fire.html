<!DOCTYPE html>
<html>
<head>
	<title>Fire & Smoke - Yotei3D Examples</title>
	<meta charset="utf-8" />
	<link href="css/examples.css" rel="stylesheet" type="text/css" />
	<script type="module">

    import { Renderer, Shapes, SceneObject, PointLight, Fire, Smoke, TouchController } from "@";

    window.addEventListener("load", function() {

      const renderer = new Renderer({
        backColor: [0.04, 0.05, 0.08, 1.0],   // night
        enablePostprocess: true,
        enableLighting: true,
        enableShadow: true,
        bloomEffect: {
          enabled: true,
          threshold: 0.5,            // bloom buffer resolution scale (downsample)
          luminanceThreshold: 1.0,   // HDR bright-pass: the flame's hot cores bloom
          intensity: 0.85,           // strength of the glow added back
        },
        renderingImage: {
          gamma: 1.1,
          resolutionRatio: 1,
        },
      });

      const scene = renderer.createScene();
      window._scene = scene;

      // ---- dark earth ----
      const ground = new Shapes.Plane();
      ground.scale.set(60, 1, 60);
      ground.mat.color = [0.12, 0.11, 0.10];
      ground.mat.roughness = 0.95;
      scene.add(ground);

      // ---- a ring of stones around the fire pit ----
      const stones = new SceneObject();
      scene.add(stones);
      for (let i = 0; i < 10; i++) {
        const a = (i / 10) * Math.PI * 2;
        const s = new Shapes.Cube();
        const r = 0.18 + Math.random() * 0.12;
        s.scale.set(r, r * 0.7, r);
        s.location.set(Math.cos(a) * 1.05, r * 0.3, Math.sin(a) * 1.05);
        s.angle.set(0, Math.random() * 90, 0);
        const g = 0.28 + Math.random() * 0.12;
        s.mat.color = [g, g * 0.96, g * 0.92];
        s.mat.roughness = 0.9;
        stones.add(s);
      }

      // ---- crisscrossed logs, warmly lit from the embers below ----
      const logs = new SceneObject();
      scene.add(logs);
      for (let i = 0; i < 4; i++) {
        const log = new Shapes.Cube();
        log.scale.set(1.7, 0.22, 0.22);
        log.location.set(0, 0.16 + (i % 2) * 0.18, 0);
        log.angle.set((i % 2) * 8, i * 45, 0);
        log.mat.color = [0.16, 0.09, 0.05];
        log.mat.roughness = 0.85;
        // glowing embers: a hot HDR self-illumination (emissiveColor > 1.0)
        // pushes the lower, hotter logs past the bloom threshold so they glow
        // like burning coals; the higher logs are cooler.
        const heat = 1.0 - (i % 2) * 0.45;
        log.mat.emissiveColor = [2.8 * heat, 0.5 * heat, 0.09 * heat];
        logs.add(log);
      }

      // ---- the fire ----
      // Added after the geometry so the depth buffer already holds the scene;
      // the fire shader tests (but doesn't write) depth, so logs occlude embers.
      const fire = new Fire({
        count: 500,
        radius: 0.55,
        height: 3.2,
        riseSpeed: 3.4,
        swayAmp: 0.2,
        swayFreq: 6.5,
        intensity: 3.5,   // HDR over-drive: hot cores blow past 1.0 to feed bloom
        sizeBase: 30,
        sizeTip: 10,
      });
      fire.location.y = 0.2;
      scene.add(fire);

      // ---- the firelight ----
      // Any object with mat.emission > 0 doubles as a point light. This warm
      // light sits in the flame and is flickered every frame (below), casting
      // dancing warm light on the ground, the stones and the logs.
      const firelight = new PointLight();
      firelight.location.set(0, 0.9, 0);
      firelight.mat.color = [1.0, 0.55, 0.22];   // warm fire colour
      firelight.mat.emission = 6.0;
      firelight.castShadow = false;
      firelight.castLight = true;
      scene.add(firelight);

      // ---- the smoke, starting where the flame thins out ----
      const smoke = new Smoke({
        count: 280,
        radius: 0.45,
        baseY: 3.6,
        height: 9,
        riseSpeed: 1.5,
        wind: [0.6, 0.15],
        swirl: 0.6,
        spread: 4.8,
        opacity: 0.1,
        sizeStart: 50,  // 22 → 36
        sizeEnd: 140,   // 90 → 140
        maxSize: 320,   // 大粒が頭打ちしないよう少し上げる
      });
      scene.add(smoke);

      let flickerT = 0;
      scene.on("frame", () => {
        fire.update();
        smoke.update();

        // flicker the firelight: layered sines + a little randomness give a
        // lively, restless flame glow. emission scales both the brightness and
        // (through the warm colour) the HDR energy that spills onto the scene,
        // so the ground and stones pulse with the fire.
        flickerT += 0.05;
        const flicker = 6.0
          + Math.sin(flickerT * 13.0) * 1.5
          + Math.sin(flickerT * 7.3) * 1.0
          + (Math.random() - 0.5) * 2.0;
        firelight.mat.emission = Math.max(2.0, flicker);

        // tiny positional jitter so highlights and shadows dance
        firelight.location.x = Math.sin(flickerT * 9.0) * 0.07;
        firelight.location.z = Math.cos(flickerT * 11.0) * 0.07;
      });

      // dim, cool moonlight so the logs and stones stay just visible
      scene.sun.location.set(-0.4, 1, 0.6);
      scene.sun.mat.color = [0.22, 0.26, 0.36];

      scene.mainCamera.fieldOfView = 50;
      scene.mainCamera.location.set(0, 2.6, 7.5);
      scene.mainCamera.angle.set(-10, 0, 0);

      const controller = new TouchController(scene);

      scene.animation = true;   // continuous redraw for the live flame
      scene.show();
    });
  </script>
</head>
<body>
	<div class="fixed t-0 z-10 w-full px-4 py-2 flex justify-between items-center">
		<div class="menu hover:text-sky-600">
			&lt; <a href="index.html">Back</a>
		</div>
    <div>Additive fire embers and rising smoke. Drag to orbit, scroll to zoom.</div>
		<div class="logo">
      <img src="/img/logo.svg">
		</div>
	</div>

	<div id="canvas-container">
	</div>
</body>
</html>
