<!DOCTYPE html>
<html>
<head>
	<title>Floor Walkthrough - Yotei3D Examples</title>
	<meta charset="utf-8" />
	<link href="css/examples.css" rel="stylesheet" type="text/css" />
	<script type="module">

    import { Renderer, SkyBox, ImageCubeBox, FloorViewController, CollisionModes } from '@'

    window.addEventListener("load", function() {

      const renderer = new Renderer({
        backColor: [0.96, 0.95, 0.92],
        
        enablePostprocess: true,
        enableAntialias: true,
        enableShadow: true,
        enableSSAO: true,
				enableLightProbes: true,
        shadowQuality: {
          scale: 10,
          viewDepth: 4,
          resolution: 1024,
          intensity: 0.25,
          enableCache: false,
        },
        bloomEffect: {
          threshold: 0.3,
          gamma: 1.2,
        },
        renderingImage: {
          gamma: 1.2,
          exposure: 1.5,
          resolutionRatio: 1,
        },
      });

      const scene = renderer.createScene();
      window._scene = scene;
      window._renderer = renderer;

      // light-probe indirect-diffuse strength (kept modest; the office is
      // already brightly lit by the glossy reflection cubemap + window sky)
      scene.probeIntensity = 1.0;

      // Place a probe volume over the loaded floor's world bounds and bake.
      // Probes sit in two height layers covering the walk-through / furniture
      // range; XZ is inset so probes don't end up buried inside the walls.
      function bakeProbeVolume(obj) {
        const b = obj.getBounds();
        if (!b) return;
        const sx = b.max.x - b.min.x, sy = b.max.y - b.min.y, sz = b.max.z - b.min.z;
        const padXZ = 0.12;
        const min = [b.min.x + sx * padXZ, b.min.y + sy * 0.25, b.min.z + sz * padXZ];
        const max = [b.max.x - sx * padXZ, b.min.y + sy * 0.75, b.max.z - sz * padXZ];
        scene.setLightProbeVolume(min, max, [4, 2, 4]); // 32 probes (= MAX_PROBES)
      }

      // used when enableEnvmap is true
      // scene.iblIntensity = 2.5;
      // scene.mainCamera.exposure = 1.5;
      // scene.iblColor = [1.15, 1.0, 0.9];

      let rootObj, refCubebox;

      const setObjectRefmap = (obj) => {
        obj.eachChild(c => {
          if (c.meshes.length > 0) c.meshes[0]._refmap = refCubebox.cubemap;
          if (typeof c.mat === 'object' && !c.mat.glossy) {
            c.mat.glossy = 0.1;
          }
        });
      };

      scene.createObjectFromURL("/models/floor.toba", obj => {
        const floorObj = obj.findObjectByName("floor");
      
        if (floorObj) {
          floorViewController.targetObject = floorObj;
          scene.mainCamera.collisionMode = CollisionModes.NavMesh;
          scene.mainCamera.collisionTarget = floorObj;
        }

        const wall = obj.findObjectByName("wall");
        if (wall) wall.mat.color = [1, 1, 1];

        obj.eachChild(child => {
          child.receiveShadow = child.name && child.name.startsWith("floor");
        });
        
        scene.add(obj);

        obj.scale.set(0.00001, 0.00001, 0.00001);

        rootObj = obj;

        if (refCubebox) {
          setObjectRefmap(obj);
        }

        setTimeout(() => {
          scene.animate({ duration: 0.7 }, t => {
            const s = Math.sin(t * 2);
            obj.scale.set(s, s, s);
          }, _ => {
            renderer.options.shadowQuality.enableCache = true;
            // model is now at full scale — bake the light-probe volume
            bakeProbeVolume(obj);
          });
        }, 500);
      });

      let baseurl = "/textures/cubemap/city/"

      scene.skybox = new SkyBox(renderer, [
        baseurl + "px.jpg", baseurl + "nx.jpg", baseurl + "py.jpg",
        baseurl + "ny.jpg", baseurl + "pz.jpg", baseurl + "nz.jpg",
      ]);

      scene.skybox.mat = { color: [1.7, 1.6, 1.5] };
      scene.skybox.visible = false;

      baseurl = "/textures/cubemap/office-256-blur/"

      refCubebox = new ImageCubeBox(renderer, [
        baseurl + "px.jpg", baseurl + "nx.jpg", baseurl + "py.jpg",
        baseurl + "ny.jpg", baseurl + "pz.jpg", baseurl + "nz.jpg",
      ]);

      refCubebox.on('load', _ => {
        if (rootObj) {
          setObjectRefmap(rootObj);
        }
      });

      const floorViewController = new FloorViewController(scene);
      
      floorViewController.on("beginChangeMode", _ => {
        if (floorViewController.topViewStatus.topViewMode) {
          if (scene.skybox) {
            scene.skybox.visible = false;
          }
        }
      });
      
      floorViewController.on("modeChanged", _ => {
        if (!floorViewController.topViewStatus.topViewMode) {
          if (scene.skybox) {
            scene.skybox.visible = true;
          }
        }

        // cache the shadowmap on first time the mode changed
        renderer.options.shadowQuality.enableCache = true;
      });

      scene.sun.direction = [0, 10, 0];
      scene.sun.mat.color = [1.0, 1.0, 1.0];
      scene.sun.intensity = 0;   // ambient/IBL-only scene (no direct sun)

      scene.show();

      // --- light-probe comparison controls ---
      const chk = document.getElementById("probe-toggle");
      const intensitySlider = document.getElementById("probe-intensity");
      chk.checked = true;
      chk.addEventListener("change", () => {
        renderer.options.enableLightProbes = chk.checked;
        scene.requireUpdateFrame();
      });
      intensitySlider.addEventListener("input", () => {
        scene.probeIntensity = parseFloat(intensitySlider.value);
        scene.requireUpdateFrame();
      });
    });


  </script>
</head>
<body>
  <div class="fixed t-0 z-10 w-full px-4 py-2 flex justify-between items-center bg-gray-800/50 text-white">
		<div class="menu hover:text-sky-600">
			&lt; <a href="index.html">Back</a>
		</div>
    <div>Space key to switch view mode. Drag to rotate, scroll to move forward.</div>
		<div class="logo">
      <img src="/img/logo.svg">
		</div>
	</div>

	<div id="probe-panel" style="position:fixed;left:16px;bottom:16px;z-index:20;background:rgba(0,0,0,.55);color:#fff;padding:10px 14px;border-radius:8px;font:13px/1.5 sans-serif;user-select:none">
		<label style="display:block;cursor:pointer"><input type="checkbox" id="probe-toggle"> Light probes (GI)</label>
		<label style="display:block">intensity <input type="range" id="probe-intensity" min="0" max="2" step="0.05" value="0.5" style="width:160px;vertical-align:middle"></label>
	</div>

	<div id="canvas-container">
	</div>
</body>
</html>
