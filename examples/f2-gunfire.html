<!DOCTYPE html>
<html>
<head>
	<title>F-2 Gun Run - Yotei3D Examples</title>
	<meta charset="utf-8" />
	<link href="css/examples.css" rel="stylesheet" type="text/css" />
	<style>
		#gun-hud{position:fixed;left:12px;bottom:12px;z-index:20;
			background:rgba(18,26,38,.62);color:#eaf2ff;
			font:12px/1.5 system-ui,-apple-system,sans-serif;
			border-radius:8px;padding:8px 12px;backdrop-filter:blur(4px);user-select:none}
		#gun-hud .gh-title{font-weight:600;margin-bottom:4px;opacity:.85}
		#gun-hud b{display:inline-block;min-width:30px;text-align:center;
			padding:0 6px;border-radius:4px;background:rgba(255,150,90,.28);
			font-weight:600}
		/* the canvas is the trigger — no text selection / context menu while firing */
		#canvas-container{cursor:crosshair}
	</style>
	<script type="module">

    import { Renderer, Shapes, SceneObject, PointLight, HDRSkyBox, Texture, Clouds, Fire, AudioMixer } from "@";

    window.addEventListener("load", function() {

      // ====== tunables — tweak these to re-aim the shot ======================
      const JET_POS  = [4.7, 0.2, 0];   // parked on the right of the frame
      const JET_YAW  = -20;             // deg about Y. 315 = front-three-quarter,
                                        // nose toward the camera's LEFT. Yaw-only
                                        // keeps the gun line = world +Z·Ry(yaw).
      // gun muzzle in model-local space: under the cockpit, fuselage left side,
      // forward toward the nose (model nose is +Z, up is +Y). Adjust if the port
      // ends up on the far side or off the airframe.
      const MUZZLE_LOCAL = [0, -1, 0.4];

      const BULLET_SPEED    = 240;   // units/sec down the gun line
      const BULLET_LIFE     = 3.8;   // seconds before a tracer recycles
      const FIRE_INTERVAL   = 0.055; // ~18 rounds/sec — spacing makes the dashes
      const MAX_BULLETS     = 96;
      // tracer shape: a thin, long streak. diameter = thickness across the line,
      // length = how long one dash is along the gun line (both in world units).
      const BULLET_DIAMETER = 0.035; // thinner reads more like a real tracer
      const BULLET_LENGTH   = 2.2;   // longer streak
      // beam divergence: the stream leaves the muzzle converged (a tight point)
      // and fans out into a cone the farther it flies. This is the half-angle of
      // that cone, in degrees — bigger = more spread downrange.
      const CONE_HALF_ANGLE = 0.5;
      const MUZZLE_JITTER   = 0.01;  // tiny scatter right at the barrel
      // =======================================================================

      const renderer = new Renderer({
        enablePostprocess: true,
        enableEnvmap: true,        // IBL from the HDRI lights the airframe
        enableShadow: false,       // airborne — nothing on the ground to shade
        enableLighting: true,      // the sun + HDRI light the jet
        perspective: { method: "persp", angle: 46, near: 0.5, far: 2500 },
        bloomEffect: {
          enabled: true,
          threshold: 0.5,
          luminanceThreshold: 1.0, // HDR bright-pass: tracer cores blow past 1.0
          intensity: 1.0,          // strong glow so the tracers haze and streak
          gamma: 1.3,
        },
        renderingImage: { gamma: 1.1, resolutionRatio: 1 },
      });

      const scene = renderer.createScene();
      window._scene = scene;

      // clear-blue-sky HDRI: lights the jet + serves as the sky background
      scene.skybox = new HDRSkyBox(renderer, "/textures/hdr/kloppenheim_06_puresky_4k.hdr", {
        faceSize: 1024,
        rotation: 115,
      });
      scene.iblIntensity = 1.0;
      scene.exposure = 1.0;
      scene.fog = { near: 120, far: 1600, color: [0.74, 0.82, 0.92] };

      // warm daylight key light
      scene.sun.direction = [-0.26, 0.1, -1];
      scene.sun.mat.color = [1.3, 1.18, 0.95];

      // a slow cloud deck for depth behind the action (drifts gently past)
      const clouds = new Clouds({
        clusters: 14,
        width: 700, depth: 700,
        height: -60, heightVariance: 60,
        clusterRadius: 30, clusterThickness: 20,
        puffsPerCluster: 48,
        puffSizeMin: 24, puffSizeMax: 110,
        wind: [10, 6],
        opacity: 0.3,
        bottomColor: [0.84, 0.88, 0.95],
        selfShadow: 0.3,
        fadeIn: 2.5, fadeMargin: 0.3,
      });
      scene.add(clouds);

      // ---- the gun line ------------------------------------------------------
      // A world-space node planted at the muzzle and yawed to match the jet, so
      // its local +Z runs straight down the barrel. Tracers and the muzzle flash
      // live under it and simply march along +Z — keeping them rock-steady in the
      // world while the airframe itself can shudder with recoil.
      const gunLine = new SceneObject();
      gunLine.angle.set(0, JET_YAW, 0);
      scene.add(gunLine);

      // a marker one unit down the barrel. Reading (gunAhead − gunLine) in world
      // space gives the TRUE forward vector straight from the engine's transform,
      // so the tracers travel exactly where the streak points — no hand-rolled
      // sin/cos that could disagree with the engine's rotation convention.
      const gunAhead = new SceneObject();
      gunAhead.location.set(0, 0, 1);
      gunLine.add(gunAhead);

      // gun-aim orthonormal basis in world space, refreshed every frame:
      // F = forward down the barrel, R = right, U = up. Cone spread + muzzle
      // scatter are built from R and U so they stay perpendicular to the shot.
      const aim = { fx: 0, fy: 0, fz: 1, rx: 1, ry: 0, rz: 0, ux: 0, uy: 1, uz: 0 };

      // ---- tracer pool -------------------------------------------------------
      // Each round is a short, over-bright additive streak. Spaced out in time at
      // the fire rate, the stream in flight reads as a dashed  - - - -  line, and
      // the HDR emission feeds the bloom pass for the hot tracer glow.
      //
      // Tracers live in this static world-space node (NOT under the jet or the
      // gun line). Each round bakes in its own world origin + heading at the
      // instant it leaves the barrel, so rotating the jet's yaw later only aims
      // *new* rounds — rounds already in flight keep streaking where they were
      // fired, instead of swinging with the airframe.
      const tracerSpace = new SceneObject();
      scene.add(tracerSpace);

      // muzzle world position, refreshed every frame from the marker
      const muzzleWorld = { x: 0, y: 0, z: 0 };

      const bullets = [];
      function makeBullet() {
        const b = new Shapes.Sphere(8, 12);
        // sphere radius is 1, so world half-extent = scale. thin across X/Y,
        // stretched along Z into a streak.
        b.scale.set(BULLET_DIAMETER / 2, BULLET_DIAMETER / 2, BULLET_LENGTH / 2);
        b.mat.color = [1.0, 0.1, 0.1];
        b.mat.emission = 20.0;            // HDR over-bright → strong bloom streak
        b.mat.additive = true;           // glowing, non-occluding
        b.mat.castLight = false;
        b.visible = false;
        b._age = 0; b._life = 0; b._active = false;
        tracerSpace.add(b);
        bullets.push(b);
      }
      for (let i = 0; i < MAX_BULLETS; i++) makeBullet();

      function spawnBullet() {
        const b = bullets.find(x => !x._active);
        if (!b) return;
        b._active = true; b.visible = true;
        b._age = 0; b._life = BULLET_LIFE;

        // bake this round's heading from the live engine-derived basis (aim),
        // so travel direction matches the barrel exactly at any yaw.
        b._fx = aim.fx; b._fy = aim.fy; b._fz = aim.fz;   // forward per unit dist

        // cone divergence: a fixed lateral slope in a random direction around the
        // barrel (in the R/U plane), scaled by distance in the frame loop —
        // converged at the muzzle, fanning out downrange.
        const az = Math.random() * Math.PI * 2;
        const slope = Math.tan(CONE_HALF_ANGLE * Math.PI / 180) * Math.sqrt(Math.random());
        const cl = Math.cos(az) * slope, sl = Math.sin(az) * slope;
        b._lx = aim.rx * cl + aim.ux * sl;
        b._ly = aim.ry * cl + aim.uy * sl;
        b._lz = aim.rz * cl + aim.uz * sl;

        // origin = current muzzle world pos + a hair of scatter across the barrel
        const jr = (Math.random() - 0.5) * MUZZLE_JITTER;
        const ju = (Math.random() - 0.5) * MUZZLE_JITTER;
        b._ox = muzzleWorld.x + aim.rx * jr + aim.ux * ju;
        b._oy = muzzleWorld.y + aim.ry * jr + aim.uy * ju;
        b._oz = muzzleWorld.z + aim.rz * jr + aim.uz * ju;

        b.angle.set(0, jetYaw, 0);   // stretch the streak along its heading
      }

      // ---- muzzle flash: a per-shot pop + a live fire-spark emitter -----------
      // (1) a bright additive bulb that flares and dies in ~50ms each round —
      //     this is the stuttering muzzle flash.
      const flash = new Shapes.Sphere(10, 16);   // segments/rings = tessellation;
                                                 // (1,1) makes an empty mesh →
                                                 // "bufferData: no data". size = scale.
      flash.mat.color = [1.0, 0.7, 0.3];
      flash.mat.emission = 9.0;
      flash.mat.additive = true;
      flash.mat.castLight = false;
      flash.visible = false;
      gunLine.add(flash);
      let flashT = 0;
      function popFlash() { flashT = 0.05; flash.visible = true; }

      // (2) a small Fire emitter spitting hot sparks out the barrel. Fire rises
      //     +Y, so +90° about X aims the embers down +Z (the gun line). Hot
      //     white→orange, short and fierce — the burnt-powder fireball.
      const muzzleFire = new Fire({
        count: 60,
        radius: 0.08,
        height: 0.9,
        riseSpeed: 7.0, riseVariance: 0.4,
        spread: 0.18, convergence: 0.4,
        swayAmp: 0.05, swayFreq: 11.0,
        sizeBase: 34, sizeTip: 6,
        intensity: 3.4,                  // HDR over-drive feeds the bloom pass
        colorHot:  [1.0, 0.95, 0.8],     // white-hot core
        colorMid:  [1.0, 0.55, 0.18],    // orange
        colorCool: [0.7, 0.12, 0.03],    // dark-red tip
        opacity: 0.9,
        sizeScale: 30,
      });
      muzzleFire.angle.set(90, 0, 0);    // fire down the gun line (+Z)
      muzzleFire.visible = false;
      gunLine.add(muzzleFire);

      // refs filled in once the model loads
      let jet = null, muzzleMarker = null, muzzleLight = null;
      let ready = false;

      scene.createObjectFromObjFormat("/models/F2/F2.obj", obj => {
        if (!obj) { console.error("failed to load F2.obj"); return; }
        jet = window.jet = obj;
        scene.add(obj);
        obj.location.set(JET_POS[0], JET_POS[1], JET_POS[2]);
        obj.angle.set(0, JET_YAW, 0);    // yaw-only (see gunLine note)

        // paint scheme + lit nav/HUD bits (same wiring as the flight demo)
        const img = new Image();
        img.onload = () => {
          const skin = new Texture(img);
          skin.flipY = true;
          obj.eachChild(c => {
            if (!c.mat) return;
            if (c.name === "body") {
              c.mat.tex = skin; c.mat.metallic = 0.1; c.mat.roughness = 0.5;
            } else if (c.name === "light-side-red") {
              c.mat.color = [1.0, 0.05, 0.0]; c.mat.emission = 2.0;
            } else if (c.name === "light-side-green") {
              c.mat.color = [0.0, 1.0, 0.1]; c.mat.emission = 2.0;
            } else if (c.name === "light-white") {
              c.mat.color = [1.0, 1.0, 1.0]; c.mat.emission = 3.0;
            } else if (c.name === "cocpit-glass") {
              c.mat.color = [0.55, 0.74, 0.83];
              c.mat.metallic = 0.1; c.mat.roughness = 0.04; c.opacity = 0.42;
            } else if (c.name === "hud-display") {
              c.mat.color = [0.15, 1.0, 0.35]; c.mat.emission = 2.0;
            }
          });
          scene.requireUpdateFrame();
        };
        img.src = "/models/F2/skin1.jpg";

        // marker at the muzzle: read its world position to plant the gun line
        muzzleMarker = new SceneObject();
        muzzleMarker.location.set(MUZZLE_LOCAL[0], MUZZLE_LOCAL[1], MUZZLE_LOCAL[2]);
        obj.add(muzzleMarker);

        // a warm point light at the muzzle — flickers on while firing
        muzzleLight = new PointLight();
        muzzleLight.location.set(MUZZLE_LOCAL[0], MUZZLE_LOCAL[1], MUZZLE_LOCAL[2] + 0.4);
        muzzleLight.mat.color = [1.0, 0.6, 0.25];
        muzzleLight.mat.emission = 0.0;
        obj.add(muzzleLight);

        // resolve transforms so the marker's world location is valid, then plant
        // the gun line + muzzle world position right at the barrel.
        obj.updateTransform();
        const m = muzzleMarker.worldLocation;
        gunLine.location.set(m.x, m.y, m.z);
        muzzleWorld.x = m.x; muzzleWorld.y = m.y; muzzleWorld.z = m.z;

        window.jet = obj;
        ready = true;
      });

      // ---- trigger + view: press = fire, drag = orbit the jet's yaw ----------
      // A press that stays put fires the cannon; once the pointer travels past a
      // small threshold it becomes a drag that spins the jet on its vertical axis
      // (and cancels firing), so you can swing the airframe around to inspect it
      // from any side. Yaw also re-aims the gun line, so new tracers follow the
      // nose wherever you point it.
      let firing = false, fireAcc = 0, recoil = 0;
      let jetYaw = JET_YAW;
      let pointerDown = false, dragging = false, downX = 0, lastX = 0;
      const DRAG_THRESHOLD = 6;     // px before a press turns into a drag
      const YAW_SENSITIVITY = 0.45; // deg of yaw per px dragged

      const container = document.getElementById("canvas-container");
      function pressStart(x, e) {
        ensureAudio();
        pointerDown = true; dragging = false; downX = lastX = x;
        firing = true;       // fire immediately; a later drag cancels it
        if (e && e.cancelable) e.preventDefault();
      }
      function pressMove(x) {
        if (!pointerDown) return;
        if (!dragging && Math.abs(x - downX) > DRAG_THRESHOLD) {
          dragging = true; firing = false;   // it's a view drag, not a shot
        }
        if (dragging) jetYaw -= (x - lastX) * YAW_SENSITIVITY;
        lastX = x;
      }
      function pressEnd() { pointerDown = false; dragging = false; firing = false; }

      container.addEventListener("mousedown", e => pressStart(e.clientX, e));
      window.addEventListener("mousemove", e => pressMove(e.clientX));
      window.addEventListener("mouseup", pressEnd);
      container.addEventListener("touchstart", e => pressStart(e.touches[0].clientX, e), { passive: false });
      window.addEventListener("touchmove", e => { if (pointerDown) pressMove(e.touches[0].clientX); }, { passive: false });
      window.addEventListener("touchend", pressEnd);
      container.addEventListener("contextmenu", e => e.preventDefault());

      // ---- sound: a flying turbine loop + a trigger-gated minigun buzz -------
      // Chrome blocks (and warns about) an AudioContext created before a user
      // gesture, so the mixer is built lazily on the first trigger pull / toggle
      // click — both are gestures. The turbine drones continuously for the flight
      // ambience; the gun loop runs continuously too but we ride its gain to
      // GUN_VOLUME only while firing and back to 0 on release, so holding the
      // button gives one unbroken "brrrt" with no per-shot clicks.
      //   Jet turbine + Minigun (freesound_community): Sound Effects from Pixabay
      const GUN_VOLUME = 0.6;
      let mix = null, gun = null, soundOn = true;
      function ensureAudio() {
        if (mix) return;                       // build once, inside a gesture
        mix = new AudioMixer();
        mix.loop("/audio/jet-turbine.mp3", { volume: 0.4 });  // flying ambience
        gun = mix.loop("/audio/gun-buzz.mp3", { volume: 0 });
        mix.enabled = soundOn;                 // resumes the context + starts loops
      }

      const soundBtn = document.getElementById("sound-toggle");
      function setSound(on) {
        soundOn = on;
        if (mix) mix.enabled = on;
        soundBtn.textContent = on ? "🔊 Sound: On" : "🔈 Sound: Off";
      }
      soundBtn.addEventListener("click", () => { ensureAudio(); setSound(!soundOn); });
      setSound(true);   // default On; the context wakes on the first gesture

      // ---- the run, frame by frame ------------------------------------------
      let t = 0;
      scene.on("frame", () => {
        const dt = 0.016;
        t += dt;

        clouds.update();

        if (ready) {
          // 1) attitude: drag-controlled yaw + a recoil shudder while firing (the
          //    tracers are world-space, so only the airframe shakes) + idle bob.
          recoil *= Math.max(0, 1 - 6 * dt);
          const r = recoil;
          jet.angle.set(
            (Math.random() - 0.5) * r * 18,
            jetYaw + (Math.random() - 0.5) * r * 12,
            (Math.random() - 0.5) * r * 24
          );
          jet.location.y = JET_POS[1] + Math.sin(t * 1.5) * 0.03;
          jet.updateTransform();   // refresh the muzzle marker's world position

          // 2) plant the gun line at the barrel and aim it down the nose (pure
          //    yaw, so recoil jitter never leaks into the shot direction).
          const mw = muzzleMarker.worldLocation;
          muzzleWorld.x = mw.x; muzzleWorld.y = mw.y; muzzleWorld.z = mw.z;
          gunLine.location.set(mw.x, mw.y, mw.z);
          gunLine.angle.set(0, jetYaw, 0);
          gunLine.updateTransform();

          // 3) read the TRUE forward straight from the engine (gunAhead − gunLine)
          //    and build a perpendicular right/up basis for spread + scatter.
          const g = gunLine.worldLocation, a = gunAhead.worldLocation;
          let fx = a.x - g.x, fy = a.y - g.y, fz = a.z - g.z;
          const fl = Math.hypot(fx, fy, fz) || 1; fx /= fl; fy /= fl; fz /= fl;
          // right = forward × worldUp(0,1,0) = (-fz, 0, fx), then normalize
          let rx = -fz, rz = fx;
          const rl = Math.hypot(rx, rz) || 1; rx /= rl; rz /= rl;
          // up = right × forward, with R = (rx, 0, rz)
          aim.fx = fx; aim.fy = fy; aim.fz = fz;
          aim.rx = rx; aim.ry = 0;  aim.rz = rz;
          aim.ux = -rz * fy;             // cross(R,F).x
          aim.uy = rz * fx - rx * fz;    // cross(R,F).y
          aim.uz = rx * fy;              // cross(R,F).z

          // 4) emit rounds at the fire rate while the trigger is held
          if (firing) {
            fireAcc += dt;
            while (fireAcc >= FIRE_INTERVAL) {
              fireAcc -= FIRE_INTERVAL;
              spawnBullet();
              popFlash();
              recoil = Math.min(recoil + 0.02, 0.06);   // build the shudder
            }
            muzzleFire.visible = true;
            muzzleLight.mat.emission = 5.0 + Math.random() * 4.0;
            if (gun) gun.volume = GUN_VOLUME;
          } else {
            fireAcc = 0;
            muzzleFire.visible = false;
            muzzleLight.mat.emission = 0.0;
            if (gun) gun.volume = 0;
          }
          muzzleFire.update();

          // 5) advance the tracers in world space. distance flown drives both the
          //    forward march and the cone's lateral spread.
          for (const b of bullets) {
            if (!b._active) continue;
            b._age += dt;
            if (b._age >= b._life) { b._active = false; b.visible = false; continue; }
            const d = BULLET_SPEED * b._age;
            b.location.set(
              b._ox + (b._fx + b._lx) * d,
              b._oy + (b._fy + b._ly) * d,
              b._oz + (b._fz + b._lz) * d
            );
          }

          // 6) muzzle flash pop: flare up then fade within ~50ms
          if (flashT > 0) {
            flashT -= dt;
            const k = Math.max(flashT / 0.05, 0);
            const s = 0.12 + 0.5 * k;
            flash.scale.set(s, s, s * 1.7);
            flash.opacity = k;
            if (flashT <= 0) flash.visible = false;
          }
        }
      });

      // fixed cinematic camera — the airframe sits to the right, firing left
      scene.mainCamera.fieldOfView = 46;
      scene.mainCamera.location.set(0, 1.6, 16);
      scene.mainCamera.angle.set(-4, 0, 0);

      scene.animation = true;
      scene.show();
    });
  </script>
</head>
<body>
	<div class="fixed t-0 z-10 w-full px-4 py-2 flex justify-between items-center">
		<div class="menu hover:text-sky-600">
			&lt; <a href="index.html">Back</a>
			&nbsp;&nbsp;
			<a id="sound-toggle" href="javascript:void(0)">🔊 Sound: On</a>
		</div>
		<div>Press to fire the cannon; drag to swing the jet's yaw and view it from any side. HDR tracers streak from the muzzle fire-sparks.</div>
		<div class="logo">
			<img src="/img/logo.svg">
		</div>
	</div>

	<div id="gun-hud">
		<div class="gh-title">Controls</div>
		<div><b>Press</b> &nbsp;fire</div>
		<div><b>Hold</b> &nbsp;sustained burst</div>
		<div><b>Drag</b> &nbsp;rotate (yaw)</div>
	</div>

	<div id="canvas-container">
	</div>

	<div class="fixed bottom-0 right-0 z-10 px-4 py-2" style="font-size:11px; opacity:0.55;">
		Sound Effect from <a href="https://pixabay.com" target="_blank" rel="noopener">Pixabay</a>
	</div>
</body>
</html>
