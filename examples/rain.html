<!DOCTYPE html>
<html>
<head>
	<title>Rain - Yotei3D Examples</title>
	<meta charset="utf-8" />
	<link href="css/examples.css" rel="stylesheet" type="text/css" />
	<script type="module">

    import { Renderer, Scene, Shapes, SceneObject, Rain, GroundFog, LightningFlash, TouchController } from "@";

    window.addEventListener("load", function() {

      const renderer = new Renderer({
        backColor: [0.06, 0.07, 0.09, 1.0],   // overcast, near-night sky
        enablePostprocess: true,
        enableLighting: true,
        enableShadow: true,
        renderingImage: {
          gamma: 1.1,
          resolutionRatio: 1,
        },
      });

      const scene = renderer.createScene();
      window._scene = scene;

      // ---- a small wet "city block" to catch the rain ----
      const ground = new Shapes.Plane();
      ground.scale.set(60, 1, 60);
      ground.mat.color = [0.12, 0.13, 0.16];
      ground.mat.roughness = 0.4;          // damp asphalt: a little reflective
      scene.add(ground);

      const city = new SceneObject();
      scene.add(city);

      for (let i = 0; i < 24; i++) {
        const box = new Shapes.Cube();
        const h = 1 + Math.random() * 5;
        const w = 0.8 + Math.random() * 1.6;
        box.scale.set(w, h, w);
        box.location.set(
          (Math.random() - 0.5) * 26,
          h / 2 - 0.5,
          (Math.random() - 0.5) * 26
        );
        const g = 0.18 + Math.random() * 0.12;
        box.mat.color = [g * 0.9, g, g * 1.1];
        box.mat.roughness = 0.7;
        city.add(box);
      }

      // ---- drifting ground fog ----
      // Stacked noise planes hugging the ground; slowly flows with the wind.
      const fog = new GroundFog({
        size: 70,
        layers: 4,
        baseHeight: 0.3,
        layerGap: 0.8,
        color: [0.58, 0.62, 0.70],
        opacity: 0.55,
        density: 0.6,
        noiseScale: 0.05,
        drift: [1.2, 0.4],   // matches the wind direction of the rain
      });
      scene.add(fog);
      scene.on("frame", () => fog.update());

      // ---- the rain ----
      // Added after the geometry so the depth buffer already holds the scene;
      // the rain shader tests (but doesn't write) depth, so buildings occlude drops.
      const rain = new Rain({
        count: 3000,
        width: 60, depth: 60, height: 34,
        speed: 30,
        wind: [5, 1.5],
        slant: 0.22,
        opacity: 0.35,
        color: [0.66, 0.76, 0.96],
        thickness: 0.01,
        lengthMin: 10,   // ← 短い雨筋（近い／細かい雨）
        lengthMax: 100,   // ← 長い雨筋
      });
      rain.location.y = 7;   // lift the volume so drops fall from above the rooftops
      scene.add(rain);

      // drive the simulation every frame
      scene.on("frame", () => rain.update());

      // gloomy key light
      scene.sun.location.set(0.6, 1, 0.4);
      scene.sun.mat.color = [0.55, 0.6, 0.72];

      // ---- lightning ----
      // Random flashes that briefly light up the sky and the whole scene.
      // Created after the sun colour is set so it captures the correct base.
      const lightning = new LightningFlash(scene, {
        minInterval: 3,
        maxInterval: 8,
      });
      window._lightning = lightning;
      scene.on("frame", () => lightning.update());

      // ---- sound ----
      // Looping rain + a one-shot thunder clap per lightning strike, mixed
      // through ONE Web Audio context. Two <audio> elements playing together is
      // unreliable on iOS Safari (it routes one to the media channel and mutes
      // the others); a single AudioContext (unlocked by one user gesture) mixes
      // a looping buffer and fresh one-shot sources reliably everywhere.
      //   Rain loop:  Sound Effect by LIECIO from Pixabay
      //   Thunder:    Sound Effect by Evana Limon from Pixabay
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const actx = new AudioCtx();

      // a looping source (rain)
      function loadLoop(url, volume) {
        const gain = actx.createGain();
        gain.gain.value = volume;
        gain.connect(actx.destination);
        const entry = { gain, buffer: null, source: null };
        fetch(url).then(r => r.arrayBuffer()).then(b => actx.decodeAudioData(b)).then(buf => {
          entry.buffer = buf;
          if (soundOn) startLoop(entry);
        }).catch(() => {});
        return entry;
      }
      function startLoop(entry) {
        if (!entry.buffer || entry.source) return;
        const src = actx.createBufferSource();
        src.buffer = entry.buffer;
        src.loop = true;
        src.connect(entry.gain);
        src.start();
        entry.source = src;
      }
      function stopLoop(entry) {
        if (entry.source) { try { entry.source.stop(); } catch (e) {} entry.source.disconnect(); entry.source = null; }
      }

      const rainLoop = loadLoop("/audio/calming-rain.mp3", 0.55);

      // a one-shot source (thunder): decode once, fire a fresh source per strike
      const thunder = { buffer: null, source: null, gain: actx.createGain() };
      thunder.gain.gain.value = 0.8;
      thunder.gain.connect(actx.destination);
      fetch("/audio/thunderstorm.mp3").then(r => r.arrayBuffer()).then(b => actx.decodeAudioData(b))
        .then(buf => { thunder.buffer = buf; }).catch(() => {});
      function playThunder() {
        if (!thunder.buffer || thunder.source) return;   // no overlap with itself
        const src = actx.createBufferSource();
        src.buffer = thunder.buffer;
        src.connect(thunder.gain);
        src.onended = () => { if (thunder.source === src) thunder.source = null; };
        thunder.source = src;
        src.start();
      }

      let soundOn = true;   // default On
      const soundBtn = document.getElementById("sound-toggle");

      function setSound(on) {
        soundOn = on;
        if (on) {
          actx.resume();
          startLoop(rainLoop);
          soundBtn.textContent = "🔊 Sound: On";
        } else {
          stopLoop(rainLoop);
          if (thunder.source) { try { thunder.source.stop(); } catch (e) {} thunder.source = null; }
          soundBtn.textContent = "🔈 Sound: Off";
        }
      }
      soundBtn.addEventListener("click", () => setSound(!soundOn));

      // Default On, but browsers block audio until a user gesture — resume the
      // context (and start the rain loop) on the first interaction.
      setSound(true);
      const unlock = () => {
        if (soundOn) { actx.resume(); startLoop(rainLoop); }
        window.removeEventListener("pointerdown", unlock);
        window.removeEventListener("keydown", unlock);
      };
      window.addEventListener("pointerdown", unlock);
      window.addEventListener("keydown", unlock);

      // play thunder just after the flash (sound lags light)
      lightning.options.onStrike = () => {
        if (!soundOn) return;
        const delay = 250 + Math.random() * 450;
        setTimeout(() => { if (soundOn) { actx.resume(); playThunder(); } }, delay);
      };

      scene.mainCamera.fieldOfView = 50;
      scene.mainCamera.location.set(0, 6, 28);
      scene.mainCamera.angle.set(-8, 0, 0);

      const controller = new TouchController(scene);

      scene.animation = true;   // continuous redraw for the falling rain
      scene.show();
    });
  </script>
</head>
<body>
	<div class="fixed t-0 z-10 w-full px-4 py-2 flex justify-between items-center">
		<div class="menu hover:text-sky-600">
			&lt; <a href="index.html">Back</a>
			&nbsp;&nbsp;
			<a id="sound-toggle" href="javascript:void(0)">🔊 Sound: On</a>
		</div>
    <div>Real-time rainfall with slanted streak particles. Drag to orbit, scroll to zoom.</div>
		<div class="logo">
      <img src="/img/logo.svg">
		</div>
	</div>

	<div id="canvas-container">
	</div>

	<div class="fixed bottom-0 left-0 z-10 px-4 py-2" style="font-size:11px; opacity:0.55;">
		Sound Effect by LIECIO from <a href="https://pixabay.com" target="_blank" rel="noopener">Pixabay</a>
		&nbsp;·&nbsp;
		Sound Effect by Evana Limon from <a href="https://pixabay.com" target="_blank" rel="noopener">Pixabay</a>
	</div>
</body>
</html>
